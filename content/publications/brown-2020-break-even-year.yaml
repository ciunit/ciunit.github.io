  alt: >
    A shaded contour plot with birth year from about 1930 to 2100 on the horizontal
    axis and life length in years on the vertical. Red shading, where an optimal mitigation
    policy reduces a generation's lifetime consumption, fills a broad band centred on
    people born around 2020 to 2050. Blue shading, where the policy increases consumption,
    lies to the upper right, beyond birth years around 2060. A dashed line marks global
    average life expectancy in 2020.
  caption: >
    Who pays and who benefits, by year of birth. Generations born up to the middle of
    this century are made worse off in consumption terms by an economically optimal
    mitigation policy; the gains accrue to generations not yet born.
