  source_figure: Figure 2
  alt: >
    Two stacked line graphs against year from 2000 to 2500. The upper panel plots surface ocean
    pH from 6.5 to 8.5; curves for the WRE stabilization pathways level off between about 7.9
    and 8.1, while cumulative emission curves for 1250, 2500, 5000, 10,000 and 20,000 petagrams
    of carbon fall progressively to about 6.8. The lower panel plots calcite and aragonite
    saturation state on the same time axis, with dashed lines marking the saturation threshold of
    1, which the larger emission curves cross.
  caption: >
    Surface ocean chemistry under stabilization pathways and under cumulative emission scenarios.
    The dashed lines in the lower panel mark saturation; curves falling below them are waters in
    which calcite or aragonite dissolves rather than forms.
