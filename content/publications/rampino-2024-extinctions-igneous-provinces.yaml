  alt: >
    A scatter plot with the ages of continental flood basalts on the horizontal axis and the ages
    of correlative marine extinction events on the vertical axis, both in millions of years from
    0 to 550. Twelve filled points labelled with paired names — end-Ordovician with Cape St
    Mary's, end-Permian with Siberian, end-Cretaceous with Deccan, and so on — lie almost exactly
    on the one-to-one line. Four red stars mark large impact craters, including Chicxulub at the
    end-Cretaceous point.
  caption: >
    Every point is an extinction plotted against the eruption it is claimed to match, and they
    fall on the diagonal. The red stars are the four largest well-dated impacts; only at the
    end-Cretaceous do an impact and a flood basalt coincide with the same extinction.
