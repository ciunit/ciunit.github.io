  source_figure: Figure 2
  alt: >
    Four scatter plots, labelled 2xCO2, 4xCO2, 6xCO2 and 8xCO2, of top-of-atmosphere radiation
    imbalance in watts per square metre against global mean temperature change in kelvin. Each
    panel shows three clouds of points in black, red and blue for the Active, Zero and
    Prescribed sea ice treatments, with fitted regression lines. Annotations give the radiative
    forcing and the climate feedback parameter for each treatment; in the 4xCO2 panel these are
    1.02 for Active and 1.33 for Zero watts per square metre per kelvin.
  caption: >
    Gregory regressions for three sea ice treatments at four CO2 levels. The slope is the climate
    feedback parameter, and it is consistently steeper without sea ice — a steeper slope meaning
    a less sensitive climate, which is how the roughly 20% contribution of sea ice is measured.
