  source_figure: Figure 4
  alt: >
    Four world maps in two columns. The left column shades the share of industrial heat demand
    met by concentrated solar thermal, from 0 to 100 per cent, at a gas fuel cost of 50 dollars
    per megawatt-hour (top) and 500 dollars (bottom); at 50 dollars the tropics and subtropics
    are yellow, above 75 per cent, while high latitudes are dark blue near zero, and at 500
    dollars almost everything below the Arctic is yellow. The right column shades the gas fuel
    cost, from 10 to 500 dollars per megawatt-hour, at which solar thermal supplies any share
    at all (top) and more than half (bottom).
  caption: >
    Latitude sets the answer. At a gas cost of 50 dollars per megawatt-hour, concentrated solar
    thermal with molten salt storage already supplies most industrial heat demand across the
    tropics and subtropics and almost none at high latitudes; the right column reads the same
    result the other way, as the gas price each place would need to reach.
