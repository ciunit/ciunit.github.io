id: govindasamy-2003-quadrupled-co2
doi: 10.1016/S0921-8181(02)00195-9
title: >
  Geoengineering Earth's radiation balance to mitigate climate change from a quadrupling of CO2
authors:
  - Bala Govindasamy
  - Ken Caldeira
  - Philip B. Duffy
journal: Global and Planetary Change
volume: "37"
pages: 157-168
date: "2003-06"
year: 2003
themes:
  - solar-geoengineering

description: >
  Reducing solar luminosity can largely cancel the regional and seasonal climate change from
  quadrupled CO2, but leaves tropical cooling and drying, incomplete polar compensation, a still-
  cold stratosphere, and sea ice not fully restored.

question:
  - >
    An earlier study had shown that reducing sunlight could largely offset the regional and
    seasonal climate change from *doubled* carbon dioxide, despite the two forcings having very
    different spatial and temporal patterns.
  - >
    Whether that continues to hold as the forcing grows is a different question — a mismatch that
    is small at 2×CO2 need not stay small at 4×. This paper tested the quadrupled case.

key_finding: >
  Reduced solar luminosity markedly diminishes regional and seasonal climate change under
  quadrupled CO2, but leaves identifiable residuals: significant decreases in surface temperature
  and net water flux in the tropics, incompletely compensated high-latitude warming, persistent
  stratospheric cooling from the greenhouse gases, and sea ice that is not fully restored.

findings:
  - >
    The main result is agreement with the doubled-CO2 case: the compensation still largely works
    at four times preindustrial carbon dioxide, so the earlier finding was not an artefact of a
    small perturbation.
  - >
    The residuals have a consistent geography. The tropics end up cooler and drier than
    preindustrial, while the high latitudes remain warmer — the classic signature of offsetting a
    uniform greenhouse forcing with a sunlight reduction that is strongest where the sun is
    strongest.
  - >
    Stratospheric cooling persists regardless, because it is caused by the greenhouse gases
    themselves and reducing sunlight does nothing about it.
  - >
    Sea ice is not fully restored, so the cryosphere does not simply return to its former state
    when the global mean temperature does.
  - >
    All of these residuals are much smaller than the change that quadrupling carbon dioxide would
    produce without any intervention.
  - >
    The authors caution that the results come from a single model and should be interpreted with
    that in mind.

matters:
  - >
    It established that the approximate cancellation holds at a large forcing, which is the case
    that matters — nobody proposes geoengineering against a small, manageable perturbation.
  - >
    Naming the residuals precisely is what makes the result useful rather than reassuring. The
    tropics-cool, poles-warm pattern and the unrestored sea ice are the specific ways a
    geoengineered world differs from one that never warmed.
  - >
    The persistent stratospheric cooling is a reminder that solar geoengineering addresses the
    energy balance and not the carbon dioxide, so some consequences are simply outside its reach.

figure:
  file: govindasamy-2003-quadrupled-co2.webp
  source_figure: Figure 2
  alt: >
    Four world maps. The left column shows surface temperature change in kelvin on a scale from
    minus 1 to 10; the right column shows where those changes are statistically significant at
    the 5% level, in grey. The top row is quadrupled carbon dioxide, warm across the entire globe
    and strongly significant everywhere. The bottom row is geoengineered quadrupled carbon
    dioxide, close to zero almost everywhere with significance confined to scattered regions.
  caption: >
    The bottom row is what reducing sunlight leaves behind. Nearly all of the 4×CO2 warming is
    removed and most of the map is no longer significantly different from the control — but the
    residual is not nothing, and it is not evenly distributed.
