  source_figure: Figure 5
  alt: >
    Four maps of Europe in two columns. The left column is the fuel-saving scenario and the
    right the fuel-replacing scenario. The top row shades the share of hydrogen demand that can
    be met cost-effectively from 0 to 1, with Germany, Denmark and the Netherlands darkest; the
    shading is markedly paler throughout the fuel-replacing column. The bottom row shades the
    share of available surplus electricity actually used, which is high across most of
    continental Europe in the fuel-saving case and much lower in the fuel-replacing case.
  caption: >
    The two columns are the same resource used two ways. Substituting electrolytic hydrogen
    whenever surplus happens to be available (left) serves a much larger share of demand and
    consumes far more of the surplus than committing to replace a fossil plant outright (right),
    because the second has to buy storage to deliver hydrogen on schedule.
