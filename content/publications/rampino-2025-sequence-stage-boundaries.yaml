  source_figure: Figure 1
  alt: >
    A step plot of the number of matches between the ages of 28 stratigraphic sequence
    boundaries and independently defined chronostratigraphic stage boundaries, on the vertical
    axis from 0 to 28, against the mismatch tolerance in millions of years on the horizontal
    axis from 0 to 5. The curve climbs steeply to about 20 matches by a tolerance of 1.2 million
    years, reaches 24 by 2 million, and is flat at all 28 from about 4 million years onward.
  caption: >
    How many of the two sets of boundaries coincide, as the tolerance for calling two dates the
    same is relaxed. Twenty of the 28 already agree within 1.2 million years and all 28 within
    4 million — a correspondence between the physical rock record and the fossil-based timescale
    far too close to be coincidence.
