  source_figure: Figure 2
  alt: >
    Two stacked line graphs of alkalinity flux in units of 10 to the 12 equivalents per year,
    from 0 to 50. The upper panel plots against atmospheric CO2 concentration relative to 300
    parts per million on a logarithmic axis from 0.1 to 100; the silicate weathering on land
    curve climbs from about 4 to 44, while the two seafloor basalt dissolution curves rise only
    from about 5 to 10. The lower panel plots against deep ocean pH from 6 to 9; silicate
    weathering falls steeply from about 47 to 2, while the basalt dissolution curves fall only
    from about 11 to 6.
  caption: >
    The comparison the paper turns on. Terrestrial silicate weathering responds strongly to both
    CO2 and ocean pH, while seafloor basalt dissolution is nearly flat across the whole range —
    and a flux that barely changes cannot regulate what it is supposed to be regulating.
