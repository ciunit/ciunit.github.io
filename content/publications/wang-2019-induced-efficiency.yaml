  source_figure: Figure 3
  alt: >
    Four scatter panels, each plotting a twenty-year rate of change against energy
    cost share in the starting year, with points for the USA, China, Europe, and the world
    in different colours and fitted regression lines. Panel A shows the rate of change in
    energy cost share itself, panel B energy-use efficiency, panel C energy-production
    efficiency, and panel D efficiency of non-energy goods and services. Panels B and C
    show clear positive slopes; panel D is close to flat.
  caption: >
    The empirical basis for induced efficiency. A higher energy cost share is
    followed by faster gains in energy-use efficiency (B) and energy-production efficiency
    (C) over the next twenty years, while efficiency of non-energy goods and services (D)
    shows no such relationship.
