id: caldeira-2013-pace-of-warming
doi: 10.1088/1748-9326/8/3/034039
title: >
  Projections of the pace of warming following an abrupt increase in atmospheric carbon dioxide
  concentration
authors:
  - Ken Caldeira
  - Nathan P. Myhrvold
journal: Environmental Research Letters
volume: "8"
pages: "034039"
date: "2013-09-30"
year: 2013
themes:
  - climate-and-carbon-cycle

description: >
  Fits to the CMIP5 models deliver roughly half of equilibrium warming within a decade of a CO2
  increase, but leave about a quarter of it to arrive more than a century later — and the models
  disagree about the timing far more than about the total.

question:
  - >
    Climate models are usually compared on how much they warm, not on how fast. Yet for risk
    assessment the schedule matters: warming that arrives within a decade and warming that
    arrives after a century are different problems.
  - >
    This paper asked how the CMIP5 models distribute warming over time after an abrupt CO2
    change, and whether that response can be captured by simple mathematical models useful for
    other calculations.

key_finding: >
  Curve fits to the CMIP5 abrupt-CO2 simulations realize approximately half of equilibrium
  warming — range 38% to 61% — within the first decade after a CO2 concentration increase, but
  approximately one quarter — range 14% to 40% — arrives more than a century later; following an
  instantaneous quadrupling of CO2, four of the 20 fitted model results reach 4 degrees Celsius
  of warming within the first decade while three require more than a century.

findings:
  - >
    The analysis uses the CMIP5 step-function CO2 simulations plus a control run to estimate
    adjusted radiative forcing, the climate feedback parameter, and effective thermal inertia
    for each model, and shows these suffice to predict the response to time-varying CO2.
  - >
    Several functional forms are tested — single-exponential, multiple-exponential, and a
    one-dimensional ocean-diffusion model. All except the single-exponential can fit most CMIP5
    results well, for both step-change and continuous pathways.
  - >
    Choosing among them is not settled by fit quality. It depends on how many free parameters
    the application can constrain and on what underlying mechanism the user wants the model to
    embody.
  - >
    The fast fraction is large: 38% to 61% of eventual warming appears within ten years. The
    slow tail is also large: 14% to 40% takes more than a century.
  - >
    The spread across models is the finding with the sharpest edge. Under instantaneous
    quadrupling, four of 20 fits pass 4 degrees Celsius within a decade and three take more than
    a century — an order-of-magnitude disagreement about timing.
  - >
    That spread motivates the paper's closing recommendation: reduce uncertainty in the temporal
    response of climate models, and account for it when assessing climate risk.

matters:
  - >
    Uncertainty in climate sensitivity is discussed constantly; uncertainty in how quickly that
    sensitivity is realized much less so. This paper shows the second is comparably large and
    matters more for anything time-bound, like adaptation planning or emissions timing.
  - >
    The simple fitted models are practical output. They let integrated assessment models and
    policy analyses reproduce CMIP5 temperature trajectories without running a general
    circulation model.
  - >
    A large fast fraction and a long slow tail together mean that most of the warming from an
    emission is felt by the people who caused it, while a substantial remainder is left to
    people a century away.

