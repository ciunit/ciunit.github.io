  source_figure: Figure 3
  alt: >
    Two horizontal bar charts listing 20 CMIP5 models by name down the left. Panel a shows the
    fraction of equilibrium temperature change realized, from 0 to 1, with each bar divided into
    shaded segments; the darkest segment, the first decade, ends between about 0.38 and 0.61
    across models. Panel b shows the same segments as absolute temperature change in kelvin, from
    0 to 10, where model totals range from about 4 to over 9.
  caption: >
    Each bar is one climate model's warming after a step change in CO2, split by when it arrives.
    The models agree far better on how much warming there is, in panel b, than on how it is
    distributed in time — the disagreement the paper argues deserves as much attention as
    uncertainty in climate sensitivity.
