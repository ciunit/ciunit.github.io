  source_figure: Figure 2
  alt: >
    Two maps of the near-equilibrium change in annual mean surface air temperature, on a scale
    from minus 0.8 to plus 0.8 °C. Panel a is a polar view of the Northern Hemisphere, labelled
    mean 0.12 ± 0.01; almost all of it is shaded light red, with the strongest warming, near
    0.8 °C, over the Arctic north of Scandinavia and Russia, and stippling marking significance
    across most of the hemisphere. Panel b zooms on East Asia, 70 to 155 degrees east and 0 to
    55 degrees north, labelled mean 0.12 ± 0.02, with warming of 0.2 to 0.4 °C over central and
    eastern China and paler warming across the rest of the region.
  caption: >
    Warming from China's 2006–2017 aerosol cuts, if sustained. It is not confined to China — the
    hemisphere as a whole warms about as much as East Asia does, and most strongly in the Arctic,
    because heat carried by the atmosphere and ocean spreads the response far beyond where the
    aerosols were removed.
