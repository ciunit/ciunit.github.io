  source_figure: Figure 3
  alt: >
    Two stacked bar charts. Panel a is system cost in dollars per kilowatt-hour: today's
    petroleum system at about 0.25, a wind-solar-battery system at about 0.246, and a system with
    hydrogen energy storage at about 0.167, broken down by technology. Panel b is system land use
    in square kilometres: about 332 for wind-solar-battery and about 265 with hydrogen storage,
    with a dashed line marking the solar capacity that could be built on rooftops for zero
    dedicated land.
  caption: >
    Adding hydrogen storage lowers both bars at once. It is cheaper than the battery-only system
    *and* the petroleum system it would replace, and it needs less of the island — because
    long-duration storage substitutes for the generating capacity that would otherwise have to be
    overbuilt.
