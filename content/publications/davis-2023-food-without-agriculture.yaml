  source_figure: Figure 2
  alt: >
    Two contour plots of greenhouse gas emissions per edible kilocalorie. Panel a, agricultural
    fats, plots land-use emissions against energy emissions in grams of CO2-equivalent per
    kilocalorie, with red dots for Sub-Saharan African oilcrops near 3.5, Brazilian soy above 2.5,
    and Indonesian, Brazilian and Colombian palm oil between 1.0 and 2.0. Panel b, synthetic
    fats, plots feedstock emissions against the emissions intensity of the energy used, with dots
    for coal and natural gas feedstocks and, at the origin, carbon dioxide feedstock with
    non-fossil energy at close to zero.
  caption: >
    The two panels are on the same units, and the synthetic route (b) reaches values the
    agricultural route (a) cannot. Real palm oil and soy sit between 1 and 3.5 grams of
    CO2-equivalent per kilocalorie; fats synthesized from captured carbon dioxide with
    non-fossil energy approach zero.
