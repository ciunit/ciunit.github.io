  source_figure: Figure 3
  alt: >
    Two bar charts comparing energy technologies for a 40-year transition away from 1 terawatt of
    coal-fired capacity. The upper panel shows the global mean temperature increase attributable
    to the energy system 100 years after the transition starts, with split columns spanning high
    and low life-cycle emissions estimates; coal is highest and conservation lowest, with natural
    gas and coal with carbon capture and storage far above wind, solar, and nuclear. The lower
    panel shows, for each technology, the number of years to break even and to reach 25 per cent
    and 50 per cent reductions in coal-caused warming, with bars for gas and carbon capture
    extending past a century while wind, solar, and nuclear cluster near the conservation case.
  caption: >
    The lower panel is the paper's argument in one picture. Technologies are separated far less
    by how much warming they eventually avoid than by how long they take to start avoiding it,
    and the partial measures sit decades behind the near-zero-emission ones.
