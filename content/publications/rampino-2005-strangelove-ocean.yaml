  source_figure: Figure 1
  alt: >
    A line graph against time after the extinction in thousands of years, from 0 to about 52. A
    blue curve of modelled atmospheric CO2, read on the left axis from 500 to 3000 parts per
    million, spikes to about 2500 within the first two thousand years and then decays to near
    1000. A black curve of modelled carbonate accumulation, read on the right axis in units of 10
    to the 12 moles per year, drops sharply at first and then climbs steadily to about 15.
  caption: >
    The productivity collapse drives a rapid CO2 spike from a Late Permian baseline of 850 to
    about 2,500 parts per million, followed by a long recovery. The rising black curve is the
    surge in shallow-water carbonate deposition that the earliest Triassic rock record preserves.
