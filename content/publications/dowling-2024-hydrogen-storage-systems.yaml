  source_figure: Figure 3
  alt: >
    Six stacked-area panels of system cost in dollars per kilowatt-hour, arranged as three pairs.
    The left column varies capital cost and the right varies efficiency or loss rate, for the
    power-to-hydrogen, hydrogen storage and hydrogen-to-power components in turn. Annotated
    arrows give the cost reduction achieved by each improvement: 4% against 1% for
    power-to-hydrogen, 12% against 0.0001% for storage, and 13% against 5% for hydrogen-to-power.
  caption: >
    Each row compares making a component cheaper against making it better. Capital cost wins
    every time at present costs, and by the largest margin for the hydrogen-to-power component —
    13% against 5% — which is why the discharge hardware, not round-trip efficiency, is where
    innovation would pay.
