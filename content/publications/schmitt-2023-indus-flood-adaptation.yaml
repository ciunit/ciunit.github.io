  source_figure: Figure 4
  alt: >
    A composite panel. A scatter plot of flood depth against distance to dry land, coloured by
    the number of people affected, is divided into zones labelled "move up", "move over" and
    "relocate". Cumulative curves show how many of the nearly 40 million impacted people fall in
    each zone, with a small bar chart summarising the four categories. Photographs show a house
    on stilts and a fortified dwelling. A map of Pakistan's Indus floodplains shades each area by
    which adaptation option applies, in blue, green and red.
  caption: >
    Depth of water and distance to dry ground decide which adaptation is available, and the
    scatter shows most of the affected population sitting in shallow water close to safety — the
    cheap-to-address majority. Only the red areas on the map need relocation or hard adaptation.
