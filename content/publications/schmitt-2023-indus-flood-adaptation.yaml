id: schmitt-2023-indus-flood-adaptation
doi: 10.1088/1748-9326/acfc59
title: >
  Move up or move over: mapping opportunities for climate adaptation in Pakistan's Indus plains
authors:
  - Rafael J. P. Schmitt
  - Edgar Virgüez
  - Sara Ashfaq
  - Ken Caldeira
journal: Environmental Research Letters
volume: "18"
pages: "114024"
date: "2023-10-25"
year: 2023
themes:
  - climate-and-economics

description: >
  Rebuilding elevated would have protected 13% of the people hit by Pakistan's 2022 Indus floods
  and relocation another 16%, while 70% faced water shallow enough for low-cost measures — but
  flood-proofed rebuilding alone adds 26 to 63% to reconstruction costs.

question:
  - >
    The 2022 Indus floods put 30 to 40 million people's homes under water and permanently
    displaced 8 million. Reconstruction after a disaster is the moment when adaptation is
    cheapest to build in, because the rebuilding is happening anyway.
  - >
    Knowing which measure to apply where requires flood-stage and demographic data at high
    resolution, which Pakistan's floodplains largely lack. This paper asked whether a rapid
    assessment could nonetheless identify where each option would work, and what it would cost.

key_finding: >
  For the 2022 Indus floods, rebuilding houses elevated and flood-proofed would have protected
  13% of affected people and temporary relocation a further 16%, while the remaining 70% faced
  water shallow enough to address with low-cost measures — but flood-proofed rebuilding alone
  would raise reconstruction costs by 26 to 63%, or $1.5 to $3.6 billion on top of $5.8 billion.

findings:
  - >
    The method pairs a high-resolution rapid assessment of flood stages with demographic data, so
    the depth of water each population faced can be matched to the adaptation that would have
    helped.
  - >
    The population splits three ways rather than two. Moving up protects 13%, moving over 16%,
    and the large remainder — 70% — were exposed to water shallow enough that low-cost measures
    would have sufficed.
  - >
    That last group is the important one, because it means most of the exposure does not require
    either expensive elevation or displacement.
  - >
    The costs are substantial even so. Flood-proofed rebuilding adds $1.5 to $3.6 billion to an
    estimated $5.8 billion reconstruction, a 26 to 63% increase, before any relocation or
    adaptation of other infrastructure is counted.
  - >
    The authors are explicit that missing local flood-stage and socio-economic data is a real
    source of uncertainty, and present the approach as a prototype for rapid post-disaster
    assessment rather than a finished plan.

matters:
  - >
    It answers a question that arrives with a deadline. Reconstruction begins within weeks of a
    flood, long before a careful multi-year study could report, so a rapid method that is roughly
    right is worth more than a precise one that arrives late.
  - >
    Splitting the affected population by water depth changes what adaptation means here. Most
    people did not need to move or to be raised — they needed something cheap — and a policy
    built only around elevation and relocation would spend heavily to protect a minority.
  - >
    It also states the cost honestly rather than presenting adaptation as free. Adding a quarter
    to two-thirds to a reconstruction bill is a real fiscal choice for Pakistan, and one made
    under the same constraint that makes the country vulnerable in the first place.

