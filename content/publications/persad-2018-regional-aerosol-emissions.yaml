  source_figure: Figure 1
  alt: >
    Panel a is a world map with eight emissions regions shaded in different colours — Brazil,
    China, East Africa, Western Europe, India, Indonesia, South Africa and the United States —
    with a note that each receives the same emission change of 22.4 teragrams of sulfate
    precursor, 1.61 of black carbon and 4.03 of organic carbon. Panel b plots global-mean
    against regional-mean surface air temperature change, both negative, with dashed lines
    marking regional-to-global ratios of 1, 2, 4, 6, 10 and 20. Western Europe sits highest at
    about minus 0.30 kelvin global-mean; India lowest at about minus 0.02.
  caption: >
    Identical emissions, different planets. Every region in panel a receives the same quantity
    and composition of aerosol, yet in panel b the resulting global cooling spans a factor of
    roughly fourteen — Western Europe at the top, India at the bottom — so where an aerosol is
    emitted matters as much as how much of it there is.
