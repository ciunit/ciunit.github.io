  source_figure: Figure 9
  alt: >
    A bar chart titled Efficiency, showing change in global mean surface temperature per teragram
    of sulfur in the stratosphere, in kelvin per teragram of sulfur, from 0 to 0.60. Three bars
    correspond to volcanic aerosol prescribed at 100, 70 and 37 hectopascals, rising from about
    0.44 through 0.52 to about 0.59 as the aerosol is placed higher.
  caption: >
    The same mass of sulfur, placed at three heights. Cooling per teragram rises by about a third
    from the lowest level to the highest — and because the amount of aerosol is prescribed rather
    than allowed to settle out, none of that gain is explained by residence time.
