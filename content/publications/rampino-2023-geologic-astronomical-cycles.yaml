  source_figure: Figure 1
  alt: >
    Three horizontal timelines stacked over a shared axis running from 0 to 260 million years
    ago. The top band marks the four major impact craters — Popigai, Chicxulub, Morokweng and
    Manicouagan. The middle band marks extinction events and the bottom band continental flood
    basalt eruptions, both as series of vertical lines. Dashed vertical lines connect events that
    fall at the same age across the bands.
  caption: >
    Three independently dated records on one axis. The vertical alignments between extinction
    events and flood basalts are the correlation the paper quantifies; the four impacts, sparse
    by comparison, coincide with only a handful of them.
