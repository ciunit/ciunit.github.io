  source_figure: Figure 5
  alt: >
    Four world maps in two rows under a 99 per cent emissions-reduction scenario. The top row is
    nuclear at the near-current cost of US$6,317 per kilowatt-electric and the bottom row at
    US$4,000; the left column shows optimized nuclear reactor capacity in kilowatts per person
    on an orange scale from 0 to 1.5, and the right column shows storage in hours of mean demand
    on a purple scale over the same range. Regions outside the 42 studied are stippled. At the
    higher nuclear cost most countries take little nuclear and a lot of storage; at the lower
    cost nuclear capacity is high almost everywhere and storage correspondingly low.
  caption: >
    Lowering the capital cost of nuclear turns storage into generation. At the near-current cost
    (top row) least-cost systems lean on storage; at US$4,000 per kilowatt-electric (bottom row)
    they build nuclear across nearly every country and need far less storage to stay reliable.
