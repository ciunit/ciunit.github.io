  source_figure: Figure 5
  alt: >
    A scatter plot of change in global mean temperature in kelvin, from 0 to 2.5, against
    percentage reduction in top-of-atmosphere solar flux, from 0 to 2. Seven grey circles are
    labelled 2 times CO2, Arctic61 and Arctic71 at 0.37 and 0.73 percent, Global at 0.73 and
    1.84 percent, and Arctic61 at 1.84 percent. A fitted line through them has the equation y
    equals minus 1.11 x plus 2.19 with an R-squared of 0.9942.
  caption: >
    Global and Arctic-only insolation reductions fall on the same straight line. Because
    high-latitude sunlight is weaker but high-latitude feedbacks are stronger, a unit of
    top-of-atmosphere albedo change buys about the same global cooling wherever it is applied.
