  source_figure: Figure 2
  alt: >
    Two scatter plots of injected carbon remaining in the ocean at year 500, in gigatonnes of
    carbon, on the horizontal axis from 0 to 10. In panel a the vertical axis is injection depth
    in metres from 0 to 4000, and the points fall along a clear line with a narrow shaded band —
    deeper injection retains more carbon. In panel b the vertical axis is delta carbon-14 in per
    mil from 0 to minus 250, and the points scatter broadly around the fitted line. Symbols mark
    eight injection sites including the Bay of Biscay, New York, Tokyo, and Bombay.
  caption: >
    Depth predicts retention; radiocarbon age does not. The tight relationship in panel a and the
    scatter in panel b are the same simulations plotted against two different candidate
    predictors, which is why picking an injection site by its radiocarbon age does not work.
