id: duffy-1997-sea-ice-salinity
doi: 10.1029/97GL01294
title: >
  Sensitivity of simulated salinity in a three-dimensional ocean model to upper ocean
  transport of salt from sea-ice formation
authors:
  - Philip B. Duffy
  - Ken Caldeira
journal: Geophysical Research Letters
volume: "24"
pages: 1323-1326
date: "1997"
year: 1997
themes:
  - ocean-acidification

description: >
  Distributing the salt rejected during sea-ice formation through the upper 160 m, rather
  than dumping it in the top model layer, eliminates two long-standing ocean model salinity
  errors — suggesting the real ocean is similarly sensitive.

question:
  - When seawater freezes, the salt is expelled rather than incorporated into the ice, and the
    resulting dense brine sinks. Ocean general circulation models had represented this by
    placing the rejected salt in the topmost model layer.
  - Those models shared two persistent errors — a deep ocean that was too fresh, and a missing
    salinity minimum at intermediate depth. This paper asked whether the treatment of brine
    rejection was responsible.

key_finding: >
  Distributing the salt rejected during sea-ice formation uniformly over the upper 160 m,
  instead of confining it to the top model layer, eliminates both the excessively fresh deep
  ocean and the missing Antarctic Intermediate Water salinity minimum, and produces a more
  realistic Antarctic Circumpolar Current.

findings:
  - >
    In the control simulation, with rejected salt placed in the top model layer, simulated
    salinities show the errors typical of ocean general circulation models — the deep ocean is
    too fresh and the intermediate-depth salinity minimum associated with Antarctic
    Intermediate Water is absent.
  - >
    In the test simulation, distributing the rejected salt uniformly over the upper 160 m,
    both problems disappear.
  - >
    The strength of the Antarctic Circumpolar Current also becomes more realistic, so the
    improvement is not confined to the salinity field it was aimed at.
  - >
    The paper is careful about what it has and has not achieved. It demonstrates the need for
    a better representation of sinking rejected salt without providing one — distributing salt
    uniformly over a fixed depth is a diagnostic device, not a physical model of the process.

matters:
  - >
    The sensitivity is the substantive result. If a model's large-scale salinity structure and
    circulation depend this strongly on the vertical distribution of rejected brine, a similar
    sensitivity may exist in the real ocean.
  - >
    That raises the stakes for Antarctic sea ice. If the ocean is as sensitive as the model,
    losing Antarctic sea ice would change the salinity and therefore the density structure of
    the global ocean, with effects reaching far beyond the Southern Ocean.

figure:
  file: duffy-1997-sea-ice-salinity.webp
  source_figure: Figure 1
  alt: >
    Three stacked latitude-depth colour sections of annual mean Atlantic Ocean salinity, from the
    surface to 4,800 metres and from 90 south to 90 north. The top panel is observations from
    Levitus and Boyer, the middle the control simulation, and the bottom the test simulation.
    The control is dominated by a large dark low-salinity mass through the southern and deep
    ocean; the test simulation is much closer to the observed panel, with the intermediate-depth
    structure restored.
  caption: >
    The middle panel is what the model does when salt rejected by forming sea ice is left in the
    top 25 metres; the bottom panel is what it does when that salt is distributed through the
    upper 160 metres. The second is visibly closer to the observations above it — the same change
    that strengthens the simulated Antarctic Circumpolar Current.
