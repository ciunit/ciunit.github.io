  file: caldeira-1991-super-plume.webp
  source_figure: Figure 3
  alt: >
    Two stacked line graphs against geologic time in millions of years, running from 60 on the
    left to 140 on the right. The upper panel plots atmospheric CO2 in parts per million, with
    four curves labelled Walker et al. 1981, Berner et al. 1983, Volk 1987, and Berner 1990;
    all rise from about 300 ppm at 60 million years to peaks between roughly 1000 and 4200 ppm
    near 115 million years. The lower panel plots temperature change in degrees Celsius, with
    the same curves peaking between about 3 and 8 degrees.
  caption: >
    Estimated mid-Cretaceous CO2 and temperature under four different formulations of how
    silicate weathering responds to CO2. All four peak near 115 million years ago, but they
    disagree by a factor of four about how high CO2 went — which is why the paper reports a range
    rather than a value.
