  source_figure: Figure 1
  alt: >
    Two stacked line graphs against the climate feedback factor on the horizontal axis from 0.5
    to 3. The upper panel plots atmospheric CO2 relative to pre-industrial from 0 to 8, with
    curves for 0 and 300 million years ago and three weathering formulations labelled GEOCARB
    III, Michaelis-Menten, and Linear, all rising to the right. The lower panel plots temperature
    change in kelvin from minus 5 to 10, with the two curves rising from about minus 4 to about 8.
  caption: >
    How steady-state CO2 and temperature depend on the strength of the biological feedback on
    weathering, for the present day and for 300 million years ago. The spread between the three
    weathering formulations is the uncertainty a forest-albedo term would have to be added on
    top of.
