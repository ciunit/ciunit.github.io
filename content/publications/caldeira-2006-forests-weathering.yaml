id: caldeira-2006-forests-weathering
doi: 10.1016/j.gexplo.2005.08.089
title: >
  Forests, climate, and silicate rock weathering
authors:
  - Ken Caldeira
journal: Journal of Geochemical Exploration
volume: "88"
pages: 419-422
date: "2006-01"
year: 2006
themes:
  - climate-and-carbon-cycle

description: >
  Forests are darker than the ecosystems they replace, so they warm the climate outside the
  tropics — and that warmth should itself speed silicate rock weathering, an effect missing from
  long-term carbon cycle models.

question:
  - >
    Over millions of years, atmospheric CO2 is set by the balance between silicate rock
    weathering and CO2 sources. Vegetation is known to affect weathering rates locally, by
    raising soil CO2, stabilizing soils, and producing organic acids.
  - >
    But forests also change the climate directly, by absorbing more sunlight than most other
    ecosystems. This paper asked whether that physical effect on climate feeds back into
    weathering, and how a carbonate-silicate cycle model could represent it.

key_finding: >
  Because forests absorb more solar radiation than the ecosystems they replace, they warm
  Earth's climate — especially outside the tropics — and that warming should itself increase
  silicate rock weathering rates, a climate-mediated pathway distinct from the soil-chemistry
  effects usually considered, for which the paper develops preliminary parameterizations from
  general circulation model simulations.

findings:
  - >
    Existing work on how land biota affect weathering concentrates on local soil processes:
    stabilizing soil cover, raising soil CO2 concentrations, and producing organic acids.
  - >
    The albedo pathway is different in kind. A forest is darker than grassland or tundra, so
    replacing one with the other changes the planet's absorbed sunlight and hence its
    temperature.
  - >
    That temperature change is not uniform. The warming from forest cover is concentrated
    outside the tropics, where the contrast against snow-covered ground is largest.
  - >
    Because weathering rates rise with temperature, the physical warming from forests should
    increase CO2 consumption by weathering — a feedback operating through climate rather than
    through soil chemistry.
  - >
    Preliminary parameterizations of the effect are derived from general circulation model
    simulations, in a form that can be inserted into carbonate-silicate cycle models.

matters:
  - >
    It connects two literatures that had run separately: the biogeophysics of how vegetation
    changes climate, and the geochemistry of how vegetation changes weathering.
  - >
    The albedo effect of forests points the opposite way to their carbon uptake at high
    latitudes, and this paper adds a third term — the weathering consequence of the resulting
    warmth — to that already awkward accounting.
  - >
    It is a small paper making a structural point: a long-term carbon cycle model that treats
    vegetation only as a soil process is missing a pathway that runs through the climate system.

