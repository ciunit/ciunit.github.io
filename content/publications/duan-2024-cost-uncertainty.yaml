  source_figure: Figure 2
  alt: >
    Four stacked-area plots, one above another, of system cost in dollars per kilowatt-hour from
    0 to 0.12 against carbon emission reduction from 0 to 100 per cent, coloured by technology.
    Panel A, all technologies at high projected cost, ends dominated by wind, solar, and
    biopower near 0.088. Panel B, only geothermal reaching its low cost, is overwhelmed by dark
    red geothermal above 90 per cent reduction. Panel C, wind and geothermal both low, is mostly
    light blue wind with a much smaller geothermal wedge. Panel D, all technologies low, reaches
    only about 0.06 and contains no geothermal at all.
  caption: >
    The same model, the same weather, the same demand — only the assumed 2050 technology costs
    differ between panels, and the composition of the least-cost zero-carbon system changes
    completely. Geothermal dominates when it alone gets cheap (B), shrinks when wind gets cheap
    too (C), and disappears when everything gets cheap (D).
