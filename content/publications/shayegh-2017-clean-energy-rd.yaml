  source_figure: Figure 3
  alt: >
    A plot of the shifting-to-following benefit ratio, from 1 to 4, against learning rate from 0
    to 25 per cent. A family of curves is labelled by cost ratio from 2 up to 256, each rising
    with learning rate. Four technologies are placed on the plane: hydro at far left with a low
    learning rate, offshore wind high on the vertical axis, onshore wind and biomass in the
    middle, and solar photovoltaics at the right with the highest learning rate.
  caption: >
    The vertical axis is how much more a curve-shifting research dollar buys than a
    curve-following one. It is highest for technologies that start expensive and learn slowly —
    offshore wind, at the top — and lowest for solar photovoltaics, which is already cheap and
    learning fast.
