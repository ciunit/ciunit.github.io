  source_figure: Figure 7
  alt: >
    A line plot of carbon in gigatonnes, 0 to over 5,000, against year from 1900 to 2300. A black
    curve for cumulative emissions rises steeply through the twenty-second century and levels
    near 5,400. Below it, a red curve for atmospheric increase and a green curve for land uptake
    both approach about 2,000 to 2,400, while a blue curve for ocean uptake climbs slowly to
    about 900.
  caption: >
    The gap between the black curve and the ones below it is what the sinks fail to take. By 2300
    the atmospheric increase alone is close to half of everything emitted, with the land doing
    more of the absorbing than the ocean throughout.
