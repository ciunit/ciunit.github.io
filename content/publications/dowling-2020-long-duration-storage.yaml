  source_figure: Figure 7
  alt: >
    Two contour plots of total electricity system cost. The upper panel varies
    battery cost on the vertical axis and long-duration storage cost on the horizontal,
    each from 100 per cent of the base case down to free; the contours run far more
    steeply across the long-duration axis than the battery axis. The lower panel varies
    long-duration storage power cost against energy cost, both as multiples of the base
    case, with markers for power-to-gas-to-power, compressed air, and pumped hydro.
  caption: >
    System cost responds much more strongly to the cost of long-duration storage than
    to the cost of batteries — the contours in the upper panel are close together across
    the horizontal axis and far apart up the vertical one.
