  alt: >
    A line graph of simulated global ocean CFC-11 content in units of 10 to the 12 moles, from 0
    to 0.8, against year from 1950 to about 1993. Two curves rise from near zero in the 1960s;
    the dotted Control curve reaches about 0.73 by 1990 while the solid Test curve reaches about
    0.50.
  caption: >
    The whole result in one plot. The two simulations differ only in whether salt rejected during
    sea-ice formation is placed in the top 25 metres or spread through the top 160 metres, and by
    1990 the Test run has absorbed about 30% less CFC-11 than the Control.
