  file: cyronak-2026-ta-dic-reef-metabolism.webp
  source_figure: Figure 2
  alt: >
    A scatter plot of total alkalinity, 2240 to 2340 micromoles per kilogram, against dissolved
    inorganic carbon, 1850 to 2200. Grey circles are daytime measurements and black circles
    night-time ones, joined by faint lines into individual day-night tracks. A solid regression
    line runs through the cloud, crossing two dashed reference lines at an open diamond marking
    the offshore reference condition. An inset histogram shows the probability distribution of
    start-to-end slopes, peaked near zero and spanning roughly minus 2 to plus 2.
  caption: >
    Each faint line is one day-night track across the reef flat, and their individual slopes vary
    far more than a single metabolic ratio would allow. The open diamond is the offshore
    reference water — without it there is nothing to anchor these excursions to, which is the
    paper's point about what the regression slope can and cannot tell you.
