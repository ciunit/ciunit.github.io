id: antonini-2021-power-density-limits
doi: 10.1016/j.apenergy.2020.116048
title: >
  Atmospheric pressure gradients and Coriolis forces provide geophysical limits to power
  density of large wind farms
authors:
  - Enrico G. A. Antonini
  - Ken Caldeira
journal: Applied Energy
volume: "281"
pages: "116048"
date: "2021"
year: 2021
themes:
  - wind-power-geophysics

description: >
  The roughly 1 W/m² ceiling on large wind-farm power density, previously known only
  empirically, follows from horizontal pressure gradients interacting with the Coriolis force
  in the Ekman layer — making the limit resource- and location-dependent.

question:
  - Observations and numerical simulations had both indicated an upper bound of order 1 watt
    per square metre on the land-area power density of very large wind farms. The bound was
    well established empirically but had no theoretical foundation.
  - This paper asked where the limit comes from — what physical process sets the rate at which
    kinetic energy removed by turbines is replenished, and why the answer should be of that
    magnitude.

key_finding: >
  Energy transport to regional-scale wind farms is governed primarily by horizontal
  atmospheric pressure gradients and their interaction with the Coriolis force and
  turbine-induced surface drag within the latitude-dependent Ekman layer; higher pressure
  gradients and lower Coriolis parameters permit higher power density, making the geophysical
  limit resource- and location-dependent rather than universal.

findings:
  - >
    The analysis combines numerical atmospheric simulations with analytic expressions, so the
    mechanism is derived rather than only observed.
  - >
    The replenishment of kinetic energy is set by horizontal pressure gradients acting through
    the Ekman layer, where the Coriolis force and the drag induced by the turbines themselves
    determine how much energy reaches turbine height.
  - >
    Because the Coriolis parameter depends on latitude, the limit does too. Lower Coriolis
    parameters — nearer the equator — permit greater energy availability and therefore higher
    potential power density.
  - >
    Stronger horizontal pressure gradients likewise permit higher power density, so the limit
    varies with the prevailing meteorology of a region as well as with its latitude.

matters:
  - >
    Supplying a theoretical basis for a previously empirical bound changes what can be done
    with it. A limit that is understood can be evaluated for any location, whereas an observed
    limit can only be reported for places already measured.
  - >
    The location dependence has practical consequences for siting. Because the ceiling is not
    a universal constant, the maximum useful size and density of a wind farm differs between
    regions in ways that a single global figure conceals.

figure:
  file: antonini-2021-power-density-limits.webp
  source_figure: Figure 4
  alt: >
    Three world maps. The first shows the Coriolis parameter, which increases
    smoothly from zero at the equator toward both poles in horizontal bands. The second
    shows mean wind speed at 2 km altitude, highest in the mid-latitude storm tracks and
    lowest near the equator. The third shows the resulting maximum wind-farm power density
    in watts per square metre, with the highest values in a band across the tropics and
    subtropics where the Coriolis parameter is small.
  caption: >
    The geophysical power-density limit follows from latitude and meteorology
    together. A small Coriolis parameter (top) and adequate wind (middle) combine to give
    the highest achievable power density (bottom), which is why the limit is not a single
    global number.
