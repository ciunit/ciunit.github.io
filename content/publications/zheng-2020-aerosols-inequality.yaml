id: zheng-2020-aerosols-inequality
doi: 10.1038/s41558-020-0699-y
title: >
  Climate effects of aerosols reduce economic inequality
authors:
  - Yixuan Zheng
  - Steven J. Davis
  - Geeta G. Persad
  - Ken Caldeira
journal: Nature Climate Change
volume: "10"
pages: 220-224
date: "2020-02-17"
year: 2020
themes:
  - climate-and-economics

description: >
  Anthropogenic aerosols were cooling the Earth by 0.72 degrees Celsius in 2010, and because
  that cooling helps hot poor economies while hurting cold rich ones, it has probably reduced
  global economic inequality.

question:
  - Anthropogenic aerosols cool the planet and so mask part of the warming caused by
    greenhouse gases. Their health effects are severely negative and almost certainly
    outweigh any climate benefit, but the climate effect itself is unevenly distributed.
  - Empirical work on climate and growth has found that warming harms economies in already
    warm places and can benefit economies in cold ones. Aerosol cooling should therefore act
    in the opposite direction in each.
  - >
    This work asked a question that follows directly: has aerosol-induced cooling helped
    poorer tropical economies and hurt wealthier high-latitude ones, and if so, what has it
    done to the distribution of income between countries?

key_finding: >
  Anthropogenic aerosol emissions were cooling the Earth by 0.72 plus or minus 0.02 degrees
  Celsius in 2010 relative to a world without them, and because that cooling benefits hot
  low-income economies while harming cold high-income ones, it reduced the ratio of per
  capita GDP between the richest and poorest population-weighted deciles by about 1.0 percent.

findings:
  - >
    Fully coupled climate simulations run with and without anthropogenic aerosol emissions
    put the aerosol cooling in 2010 at 0.72 plus or minus 0.02 degrees Celsius.
  - Applying empirical temperature-to-growth damage relationships to that cooling pattern
    gives opposing effects by region — economic benefit in the warm, largely poorer tropics
    and economic harm in the cold, largely richer high latitudes — so the net effect on
    global output is small.
  - >
    The distributional effect is not small in the same sense. Aerosol cooling reduces the
    ratio of per capita GDP between the top and bottom population-weighted deciles by 1.01
    percent (90 percent confidence interval 0.59 to 1.56 percent), with greater than 99
    percent likelihood that the ratio falls at all.
  - The direction of the inequality result holds across most of the alternative damage
    functions tested, even though the estimated effect on global GDP ranges from a loss of
    0.1 percent to a gain of 0.51 percent depending on which function is used.

matters:
  - Aerosol emissions are falling as countries clean up their air, which is unambiguously
    good for human health. This work identifies a consequence that runs the other way — the
    same clean-up removes a cooling that has been disproportionately benefiting poorer
    tropical economies, and so will tend to widen global economic inequality.
  - It reframes the aerosol masking effect as a distributional question rather than only a
    question about global mean temperature. The global average conceals large offsetting
    regional effects.
  - The result strengthens the case for treating air quality policy and climate policy
    together, since the equity consequences of the two are entangled through this channel.

figure:
  file: zheng-2020-aerosols-inequality.webp
  source_figure: Figure 4
  alt: >
    A bar chart of country-level percentage change in GDP attributable to aerosol-induced
    cooling, from minus 2.0 to plus 2.0, with countries ordered along the horizontal axis by
    cumulative share of global GDP from 0 to 100 per cent. Bars are coloured by GDP per capita.
    A dashed line near 27 per cent separates damage on the left from benefit on the right.
    Greenland, Russia and Canada sit lowest; Oman, India and Saudi Arabia highest.
  caption: >
    Countries are ordered by cumulative share of global GDP, so the horizontal axis is the world
    economy from poorest-performing to richest. Aerosol cooling damages the wealthy, cool
    economies on the left and benefits the hot, poorer ones on the right — which is why removing
    aerosols as air quality improves widens economic inequality rather than narrowing it.
