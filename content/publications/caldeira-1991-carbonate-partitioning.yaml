  source_figure: Figure 2
  alt: >
    Two stacked line graphs against time in millions of years from 0 to 500. The upper panel
    plots continental carbonate fraction from 0 to 1; two curves start together near 0.96, and
    one stays at 1.0 while the other falls steeply after 150 million years to about 0.08. The
    lower panel plots relative silicate rock weathering rate on a logarithmic axis from 0.1 to
    100; the corresponding curves diverge from 1, one rising to about 12 and the other falling
    to about 0.35.
  caption: >
    Two runs of the same model differing only in their starting carbonate fraction — 0.961 and
    0.963 — separate completely and settle into different steady states, one continental and one
    pelagic, with silicate weathering rates differing by a factor of about 35. This is what the
    paper means by two stable modes.
