id: matthews-2007-geoengineering-transient
doi: 10.1073/pnas.0700419104
title: Transient climate-carbon simulations of planetary geoengineering
authors:
  - H. Damon Matthews
  - Ken Caldeira
journal: Proceedings of the National Academy of Sciences
volume: "104"
pages: 9949-9954
date: "2007"
year: 2007
themes:
  - solar-geoengineering

description: >
  The climate responds quickly to artificially reduced sunlight, so there may be little cost
  to delaying deployment — but the same speed means stopping abruptly would produce rapid
  warming, the risk now known as termination shock.

question:
  - Proposals to counteract greenhouse warming by managing incoming sunlight had been assessed
    mostly in equilibrium. That leaves open how the system behaves during the transition — how
    fast it responds when the intervention starts, and what the carbon cycle does meanwhile.
  - This paper asked what the transient climate response to geoengineering looks like under a
    business-as-usual emissions scenario, using a model with an interactive carbon cycle so that
    climate and carbon respond to each other.

key_finding: >
  The climate system responds quickly to artificially reduced insolation, so there may be
  little cost to delaying deployment of geoengineering until dangerous climate change is
  imminent; geoengineered spatial temperature patterns are comparable to preindustrial
  temperatures, though precipitation patterns are not.

findings:
  - >
    The simulations use an intermediate-complexity global climate model including an
    interactive carbon cycle, run under a business-as-usual CO2 emissions scenario.
  - >
    The response to reduced insolation is fast. Because the climate reaches the intended state
    quickly once the intervention begins, there is little penalty for waiting rather than
    deploying pre-emptively.
  - >
    Spatial patterns of temperature under geoengineering are comparable with preindustrial
    temperatures. Precipitation patterns are not — the correspondence that holds for
    temperature does not extend to the hydrological cycle.
  - >
    Carbon sinks increase under geoengineering. Because the intervention masks warming, CO2
    continues to drive carbon uptake without the offsetting suppression that rising
    temperatures would otherwise cause.

matters:
  - >
    The speed of response cuts both ways, and this is the paper's most consequential
    implication. If the climate reaches its geoengineered state within years of starting, it
    will also leave that state within years of stopping — which is the origin of the concern
    now known as termination shock.
  - >
    The finding that carbon sinks strengthen is easy to miss and easy to misread. It is not a
    co-benefit so much as a reminder that geoengineering masks warming while leaving the CO2 in
    place, so the underlying commitment continues to accumulate behind the intervention.
  - >
    The temperature-precipitation asymmetry sets a limit on what "restoring the climate" could
    mean. A world whose temperature resembles the preindustrial one but whose rainfall does not
    is not the preindustrial climate.

figure:
  file: matthews-2007-geoengineering-transient.webp
  source_figure: Figure 3
  alt: >
    Two stacked panels covering model years 2000 to 2100. The upper panel shows global
    surface air temperature for scenarios in which geoengineering is deployed and later
    stopped in about 2025, 2050, and 2075, each curve flat while the intervention runs and
    then climbing steeply to rejoin the unmitigated case. The lower panel shows the rate of
    temperature change in kelvin per decade, near zero during deployment and spiking to
    between 2 and 4 kelvin per decade at each termination.
  caption: >
    The climate reaches its geoengineered state within years, and leaves it just as
    fast. Each termination produces a burst of warming several times faster than anything
    in the unmitigated scenario — the origin of the concern now called termination shock.
