  source_figure: Figure 2
  alt: >
    A line graph with the logarithm of CO2 partial pressure on the vertical axis from minus 2 to
    0.5, against effective solar flux on the horizontal axis from 0.7 to 1.0. Two solid curves
    mark the onset of polar and of equatorial CO2-cloud cover, both rising to the right. Three
    dashed lines falling to the right show equatorial surface temperature at 273, 263, and 253
    kelvin. Arrows label three cases at solar flux values of about 0.75, 0.85, and 0.95.
  caption: >
    Whether an ice-covered Earth can melt itself out depends on which line it crosses first. In
    Case 1, at nearly present solar flux, volcanic CO2 accumulates and melts the ice before CO2
    clouds form. In Cases 2 and 3, under the fainter early Sun, the clouds form first and their
    reflectivity blocks the escape.
