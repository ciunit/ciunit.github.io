  source_figure: Figure 1
  alt: >
    Eighteen line plots in six rows, one per country — China, Germany, the United States,
    South Africa, Brazil, and Australia — and three columns. The left column shows annual
    variability of wind, solar, and electricity demand across the months of the year for
    1980 to 2018; the middle and right columns show average daily variability across the
    hours of the day in summer and in winter. Wind is drawn in purple, solar in yellow,
    and demand in red, each as a median line inside shaded bands spanning the middle 50%
    and the full range. Power is expressed as a multiple of its 39-year mean.
  caption: >
    Wind, solar, and electricity demand follow very different annual and daily cycles,
    and the pattern differs sharply between countries. Solar output rises to a midday peak
    everywhere while wind stays comparatively flat through the day, and Germany's swing
    between abundant summer solar and winter-dominant wind is far larger than Brazil's or
    Australia's.
