id: tong-2021-geophysical-constraints
doi: 10.1038/s41467-021-26355-z
title: Geophysical constraints on the reliability of solar and wind power worldwide
authors:
  - Dan Tong
  - David J. Farnham
  - Lei Duan
  - Qiang Zhang
  - Nathan S. Lewis
  - Ken Caldeira
  - Steven J. Davis
journal: Nature Communications
volume: "12"
pages: "6146"
date: "2021-10-22"
year: 2021
themes:
  - wind-and-solar-reliability

description: >
  Across 42 countries, wind- and solar-only electricity systems sized to annual demand
  met 72-91% of hourly demand without storage, and 83-94% with 12 hours of storage.

question:
  - An electricity system built mainly on wind and solar generation produces power when
    the weather allows, not when demand arrives. This paper asked how much of a country's
    hourly electricity demand wind and solar resources could actually meet, given the
    geophysical variability of sunlight and wind.
  - The question was deliberately posed as a geophysical bound rather than a forecast.
    The analysis assumes perfect transmission within each country and annual generation
    equal to annual demand, so what remains is the mismatch imposed by the weather and
    climate themselves, before any question of cost, policy, or engineering.

key_finding: >
  Using 39 years of hourly weather data for 42 countries, the most reliable wind- and
  solar-only electricity systems — with annual generation equal to annual demand and no
  storage — met 72-91% of hourly electricity demand, rising to 83-94% with 12 hours of
  storage.

findings:
  - The analysis used 39 years of hourly reanalysis data covering 1980 to 2018, varying
    the scale of generation, the mix between wind and solar, and the amount of energy
    storage, for each of 42 countries. The most reliable systems were wind-heavy, meeting
    72-91% of hours of electricity demand with no storage and 83-94% with 12 hours of storage.
  - Reliability did not approach completeness even in the best cases. In systems that met
    more than 90% of demand, hundreds of hours of unmet demand still occurred in a typical
    year. The shortfalls are concentrated in particular periods rather than spread thinly
    across the year, which is what makes them difficult to cover.
  - The resource mismatch has a strong geographical signature. Solar output peaks near
    midday everywhere, while wind is comparatively flat across the day, and the seasonal
    swing between summer and winter availability is far larger in a country such as Germany
    than in Brazil or Australia.

matters:
  - The result reframes reliability as a geophysical constraint before it is an engineering
    or an economic one. The gap between what wind and solar can supply and what demand
    requires is set in the first instance by the atmosphere, and no amount of cost reduction
    in generation alone closes it.
  - By quantifying the residual gap, the analysis also quantifies what would be needed to
    close it — the power capacity, energy capacity, and utilisation rates of additional
    storage, demand management, or curtailment, along with the benefit obtained by
    aggregating supply and demand across larger regions.

