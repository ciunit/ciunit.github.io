id: duan-2025-adaptation-abatement
doi: 10.1038/s43247-024-01976-6
title: >
  Near-term benefits from investment in climate adaptation complement long-term economic
  returns from emissions reduction
authors:
  - Lei Duan
  - Angelo Carlino
  - Ken Caldeira
journal: Communications Earth & Environment
volume: "6"
date: "2025"
year: 2025
themes:
  - climate-and-economics

description: >
  Adaptation returns on investment far sooner than abatement does, so investing in both
  yields greater near-term and long-term net benefit than abatement alone — with discount
  rates governing one timescale and capital depreciation the other.

question:
  - Emissions abatement reduces climate damage decades hence; adaptation reduces climate
    damage now. Both are investments, but they pay back on very different schedules.
  - This paper asked how the timescales of economic return compare, and whether deploying the
    two together produces a better outcome than either alone.

key_finding: >
  Relative to investment in abatement, adaptation has a much shorter timescale for economic
  return, and deploying adaptation alongside abatement delivers earlier benefits than
  abatement alone — with greater net benefit in both the near and the long term from the
  combination.

findings:
  - >
    Using a parsimonious economic-climate assessment model, the study compares the time
    profile of returns from investment in abatement against investment in adaptation.
  - >
    The two are governed by different parameters. The timescale of return on abatement depends
    strongly on the economic discount rate; the timescale of return on adaptation depends
    strongly on the capital depreciation timescale.
  - >
    The combination outperforms either alone, with abatement reducing long-term climate damage
    while adaptation reduces near-term damage.
  - >
    The strategies do interact. Higher levels of abatement investment, of the kind implied by
    stringent emissions constraints, reduce the returns available from adaptation investment —
    because successful abatement leaves less damage for adaptation to avert.
  - >
    Even accounting for that interaction, investing in both yields greater net benefits in both
    the near and the long term than investing in abatement alone.

matters:
  - >
    The finding addresses the political timing problem directly. If abatement's benefits arrive
    beyond the horizon of the generation paying for them, then a complementary investment that
    pays back within that horizon changes the incentives facing the people who must decide.
  - >
    It also resists the framing of adaptation and abatement as rivals for the same budget. They
    address damage on different timescales, so the relevant question is the mix rather than the
    choice.

