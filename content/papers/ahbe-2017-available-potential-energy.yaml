  source_figure: Figure 3
  alt: >
    Two panels. The left shows zonal mean generation of available potential energy as
    a function of latitude and atmospheric pressure, with strong positive generation in a
    column over the equator and over both poles, and negative values in the subtropics. The
    right shows vertically integrated generation on a world map, with the largest values
    over the western tropical Pacific and around the polar regions.
  caption: >
    Where the energy that drives the winds is generated. Two sources dominate — latent
    heat release in the tropics, especially over the western tropical Pacific, and radiative
    cooling in the polar regions.
