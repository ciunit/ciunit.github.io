id: caldeira-1993-kt-carbon-cycle
doi: 10.1029/93PA01163
title: >
  Aftermath of the end-Cretaceous mass extinction — possible biogeochemical stabilization of
  the carbon cycle and climate
authors:
  - Ken Caldeira
  - Michael R. Rampino
journal: Paleoceanography
volume: "8"
pages: 515-525
date: "1993"
year: 1993
themes:
  - ocean-acidification

description: >
  After the K/T extinction, pelagic carbonate productivity collapsed but the expected
  dramatic fall in atmospheric CO2 is absent from the record — shallow-water carbonate
  deposition, responding to carbonate ion concentration, appears to have buffered it.

question:
  - For several hundred thousand years after the Cretaceous/Tertiary boundary event about 65
    million years ago, pelagic carbonate productivity was greatly reduced. Organisms that had
    been removing carbonate from the ocean largely stopped doing so.
  - Arithmetically that should have caused carbon and alkalinity to accumulate in the oceans,
    atmospheric CO2 to fall dramatically, and the deep ocean to become fully saturated with
    respect to calcite. The geological record shows no such episode. This paper asked what
    prevented it.

key_finding: >
  A more-than-threefold decrease in pelagic carbonate productivity after the K/T boundary
  should have caused atmospheric CO2 to fall dramatically and the deep ocean to become fully
  calcite-saturated, but no such interval is recorded — indicating ocean chemistry was
  buffered, plausibly by shallow-water carbonate deposition responding to rising carbonate
  ion concentration.

findings:
  - >
    The mismatch is the starting point. Pelagic carbonate productivity fell by a factor greater
    than three, and absent some compensating removal of carbonate, carbon and alkalinity would
    have accumulated in the ocean.
  - >
    The predicted consequences — a dramatic fall in atmospheric partial pressure of CO2 and a
    fully calcite-saturated deep ocean in the earliest Tertiary — are not evident in the
    record.
  - >
    A four-box ocean model shows how the discrepancy can be resolved. If shallow-water
    carbonate accumulation rates depend in part on carbonate ion concentration, then as
    carbonate ion rises in response to diminished pelagic productivity, shallow-water
    deposition increases and removes the excess.
  - >
    That makes shallow-water carbonate deposition a stabilizing feedback on ocean chemistry,
    capable of absorbing a very large disruption to the biological carbon pump.

matters:
  - >
    The paper is an early example of using a mass extinction as a natural experiment on the
    carbon cycle. A perturbation far larger than anything observable today reveals which
    feedbacks are strong enough to matter.
  - >
    The feedback identified here also sets expectations for the present. Carbonate chemistry
    has mechanisms that stabilize it over hundreds of thousands of years, which is precisely
    why they offer no protection against a disturbance delivered over two centuries.

