id: duan-2025-temperature-extremes
doi: 10.1038/s43247-025-02579-5
title: >
  Historical model biases in monthly high temperature anomalies indicate under-estimation
  of future temperature extremes
authors:
  - Lei Duan
  - Lyssa M. Freese
  - Govindasamy Bala
  - Ken Caldeira
journal: Communications Earth & Environment
volume: "6"
pages: "604"
date: "2025-07-30"
year: 2025

description: >
  CMIP6 models underestimate monthly high-temperature anomalies by 2-3% on average and
  11-12% at the extreme; carried forward, that bias implies 2100 extremes up to 3 K, and in
  the most extreme cases more than 5 K, above current projections.

question:
  - The damage done by a heat extreme depends both on the mean climate state and on how far
    an individual month departs from that mean. Climate model evaluation has concentrated on
    the mean state; how well models reproduce the anomalies has been far less explored.
  - This paper asked how skilfully the models participating in the Coupled Model
    Intercomparison Project Phase 6 (CMIP6) reproduce monthly high-temperature anomalies
    relative to monthly means, and what their historical errors imply for projected extremes.

key_finding: >
  CMIP6 models have underestimated 22-year-average monthly high-temperature anomalies by
  2-3% and 22-year maximum anomalies by 11-12%; if those historical biases carry forward,
  average 2100 extreme high temperatures in some regions and months could exceed current
  projections by 3 K, and by more than 5 K in the most extreme cases.

findings:
  - Globally, the models underestimated 22-year-average monthly high-temperature anomalies
    by 2-3%, and underestimated 22-year maximum anomalies by 11-12%. The error is
    substantially larger for the extremes than for the average.
  - The biases are persistent rather than transient. Both positive and negative biases remain
    largely unchanged, regionally and seasonally, across the two historical periods
    examined — 1980 to 2001 and 2002 to 2023 — which is what justifies projecting them forward.
  - The models project that as the planet warms, high-temperature anomalies will grow in
    subtropical regions and shrink in high latitudes, so the anomaly component of an extreme
    is not simply a fixed offset added to a rising mean.
  - Carrying the historical biases forward implies that average 2100 extreme high temperatures
    in some regions and months could be about 3 K higher than currently projected, and more
    than 5 K higher in the most extreme cases.

matters:
  - Impacts from heat are driven by the extremes, not the averages, and a bias that is modest
    in the mean becomes large in the tail. An 11-12% underestimate of maximum anomalies
    translates into whole degrees of additional projected extreme heat.
  - Because the biases are stable across decades and identifiable by region and season, they
    can be corrected for rather than merely acknowledged — which makes this a usable
    adjustment to projections rather than only a caution about them.

figure:
  file: duan-2025-temperature-extremes.png
  source_figure: Figure 1
  alt: >
    Four panels. Panels A, B, and C are time series from 1980 to 2100 showing the trend,
    as a ratio relative to the 1980-2023 period, in the monthly maximum temperature TXx,
    the monthly mean temperature TMm, and the anomaly of TXx above the monthly mean. Each
    has a median line with shaded 25th-75th and 5th-95th percentile bands. TXx and TMm both
    rise steadily to about 1.01, while the anomaly stays flat at 1.00 with widening spread.
    Panel D shows violin plots of trends from linear regression in kelvin per kelvin for the
    three quantities, with TXx and TMm centred near 1.25 and the anomaly centred near zero.
  caption: >
    Monthly maximum temperature and monthly mean temperature are projected to rise together
    at roughly the same rate, while the anomaly of the maximum above the mean shows
    essentially no global trend — the spread across models and regions, however, is wide,
    which is where the regional increases and decreases in anomalies are hidden.
