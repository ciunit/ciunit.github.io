  source_figure: Figure 2
  alt: >
    A scatter plot of Antarctic ice loss in metres of sea-level equivalent against
    cumulative CO2 emissions in gigatonnes of carbon on a logarithmic axis from about 100
    to 10,000. Three curves show the commitment after 1000, 3000, and 10,000 years, all
    rising steeply beyond about 500 gigatonnes. Inset maps of Antarctica show progressively
    less ice at higher emissions. A red band across the top marks the ice-free state, upper
    axes give peak warming, and a grey band at the right marks total fossil resources.
  caption: >
    Sea-level commitment from Antarctic ice loss against cumulative emissions. The
    response is threshold-like rather than gradual, and the grey band at the right shows
    that the total attainable fossil resource reaches the ice-free end of the curve.
