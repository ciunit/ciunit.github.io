id: winkelmann-2015-antarctic-ice-sheet
doi: 10.1126/sciadv.1500589
title: >
  Combustion of available fossil fuel resources sufficient to eliminate the Antarctic
  Ice Sheet
authors:
  - Ricarda Winkelmann
  - Anders Levermann
  - Andy Ridgwell
  - Ken Caldeira
journal: Science Advances
volume: "1"
date: "2015"
year: 2015
themes:
  - climate-and-carbon-cycle

description: >
  Burning the attainable fossil-fuel resource, about 10,000 GtC, would leave Antarctica
  almost ice-free and raise sea level by more than 3 m per century for a millennium; West
  Antarctica destabilizes after only 600-800 GtC more.

question:
  - The Antarctic Ice Sheet holds water equivalent to 58 metres of global sea-level rise.
    Whether that ice is at risk on any timescale relevant to the fossil-fuel era had not
    been established.
  - This paper asked a deliberately simple question with a bounded answer. Are the fossil
    fuel resources actually available to be burned sufficient, in themselves, to eliminate
    the Antarctic Ice Sheet?

key_finding: >
  Burning the currently attainable fossil fuel resources, about 10,000 gigatonnes of carbon,
  is sufficient to render Antarctica almost ice-free, with sea-level rise averaging more
  than 3 m per century during the first millennium; the West Antarctic Ice Sheet becomes
  unstable after only 600 to 800 GtC of additional emissions.

findings:
  - >
    Simulations with the Parallel Ice Sheet Model show that cumulative emissions of 10,000
    GtC leave Antarctica almost entirely ice-free. The associated sea-level rise exceeds an
    average of 3 metres per century through the first thousand years.
  - >
    The threshold for irreversible loss is far lower than the total. Consistent with
    observations and other simulations, the West Antarctic Ice Sheet becomes unstable with
    only 600 to 800 GtC of additional carbon emissions.
  - >
    Beyond that point, destabilization of ice basins in both West and East Antarctica
    produces a threshold-like increase in global sea level rather than a smooth response.
  - >
    The sea-level contribution from Antarctica under unabated emissions far exceeds that of
    all other possible sources combined.

matters:
  - >
    The result establishes that the ice sheet is not a spectator to the fossil-fuel question.
    The quantity of carbon required to eliminate it is not a hypothetical excursion but the
    resource base that exists and is, in principle, extractable.
  - >
    The gap between the two numbers is where the decision lies. Eliminating the whole ice
    sheet takes 10,000 GtC, but committing to the loss of West Antarctica takes 600 to 800
    GtC — a quantity within reach of scenarios currently under discussion.
