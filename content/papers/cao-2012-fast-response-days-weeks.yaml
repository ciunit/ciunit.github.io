id: cao-2012-fast-response-days-weeks
doi: 10.1088/1748-9326/7/3/034015
title: >
  Climate response to changes in atmospheric carbon dioxide and solar irradiance on the time
  scale of days to weeks
authors:
  - Long Cao
  - Govindasamy Bala
  - Ken Caldeira
journal: Environmental Research Letters
volume: "7"
pages: "034015"
date: "2012"
year: 2012
themes:
  - solar-geoengineering

description: >
  Within days of a step change in forcing, CO2 and sunlight already behave differently — over
  ocean, added CO2 stabilizes the atmosphere and suppresses evaporation and precipitation,
  while equivalent added sunlight barely does.

question:
  - Solar geoengineering rests on the premise that reduced sunlight can substitute for reduced
    CO2. Whether that substitution is clean depends on whether the two forcings act on the
    climate in the same way.
  - Fast responses, occurring within a month and before the surface has warmed, had been shown
    to matter for long-term climate change. This paper asked how the fast response to
    quadrupled CO2 differs from the fast response to increased solar irradiance.

key_finding: >
  Significant climate effects appear within days of a stepwise increase in either atmospheric
  CO2 or solar irradiance, but they differ in kind — over ocean, increased CO2 warms the lower
  troposphere more than the surface, increasing atmospheric stability, moistening the boundary
  layer, and suppressing evaporation and precipitation, whereas increased solar irradiance
  produces a much smaller change.

findings:
  - >
    The study contrasts a step-function quadrupling of atmospheric CO2 against a 4 per cent
    increase in solar irradiance, examining the response on timescales of days to weeks.
  - >
    Over ocean the two forcings diverge sharply. CO2 warms the lower troposphere more than the
    surface, which increases stability, moistens the boundary layer, and suppresses evaporation
    and precipitation. Solar forcing warms the lower troposphere far less and changes
    evaporation and precipitation much less.
  - >
    Over land the two are more alike in sign. Both produce rapid surface warming that tends to
    increase evaporation and precipitation.
  - >
    A distinctly non-radiative effect operates over land as well. The physiological response of
    plant stomata to higher CO2 reduces transpiration, drying the boundary layer — an effect
    that increased sunlight does not produce at all.

matters:
  - >
    The differences appear before any surface warming has occurred, which means they are
    properties of the forcings themselves rather than consequences of the climate response.
    They cannot be removed by tuning the magnitude of the intervention.
  - >
    That is directly relevant to solar geoengineering. Sunlight reduction can cancel the
    temperature effect of CO2, but the hydrological and physiological effects belong to CO2
    alone, so the substitution is incomplete however carefully it is calibrated.

figure:
  file: cao-2012-fast-response-days-weeks.webp
  source_figure: Figure 1
  alt: >
    Two panels. The upper plots change in precipitation against change in surface
    temperature for quadrupled CO2 in black and a 4 per cent increase in solar irradiance in
    red, at daily, monthly, and yearly resolution, with separate regression lines that are
    parallel but offset. The lower panel shows change in precipitation over the first thirty
    days, where the CO2 case drops immediately to about minus 0.07 metres per year while the
    solar case stays near zero.
  caption: >
    The offset between the two regression lines is the fast response, and it appears
    within days. Quadrupling CO2 suppresses precipitation immediately, before any surface
    warming; an equivalent increase in sunlight does not.
