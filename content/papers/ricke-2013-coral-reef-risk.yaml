id: ricke-2013-coral-reef-risk
doi: 10.1088/1748-9326/8/3/034003
title: >
  Risks to coral reefs from ocean carbonate chemistry changes in recent earth system model
  projections
authors:
  - Katharine L. Ricke
  - James C. Orr
  - Kate Schneider
  - Ken Caldeira
journal: Environmental Research Letters
volume: "8"
pages: "034003"
date: "2013"
year: 2013
themes:
  - ocean-acidification

description: >
  In preindustrial times 99.9% of reefs sat in water with aragonite saturation above 3.5;
  under RCP 8.5 every reef considered is surrounded by water below 3 by 2100, at which point
  the specific threshold no longer matters.

question:
  - Coral reefs are threatened by several stressors at once, and it is easy to lose the
    specific contribution of ocean chemistry among them.
  - This paper asked what the CMIP5 generation of Earth system models implies for the open
    ocean carbonate chemistry surrounding reefs, and how the answer depends on where the
    biological threshold for reef survival actually lies — a quantity that is not precisely
    known.

key_finding: >
  In preindustrial times, 99.9 per cent of reefs adjacent to open ocean lay in waters with
  aragonite saturation above 3.5; under a business-as-usual RCP 8.5 scenario every reef
  considered will be surrounded by water with saturation below 3 by the end of this century,
  at which point the reefs' fate is independent of which specific saturation threshold is
  assumed.

findings:
  - >
    Projections come from Earth system models participating in the Coupled Model
    Intercomparison Project Phase 5, evaluated against three candidate aragonite saturation
    thresholds rather than a single assumed value.
  - >
    The preindustrial baseline is nearly uniform. Essentially every open-ocean reef sat in
    water above the highest threshold considered, which indicates how far outside the
    historical envelope the projected chemistry lies.
  - >
    Under RCP 8.5 the threshold question becomes moot. Every reef ends the century below even
    the most permissive threshold, so uncertainty about coral tolerance stops mattering.
  - >
    Under scenarios with significant emissions abatement, by contrast, the threshold is
    decisive — where exactly reefs fail determines how many survive, so the biological
    uncertainty becomes the dominant one.

matters:
  - >
    The structure of the result is unusually clean. A large scientific uncertainty about coral
    physiology is irrelevant on the high-emissions path and central on the low-emissions path,
    which means the value of resolving it depends on which path is taken.
  - >
    It also frames abatement in terms reefs make concrete. The difference between scenarios is
    not a difference in degree of harm but the difference between a threshold question and no
    question at all.

figure:
  file: ricke-2013-coral-reef-risk.webp
  source_figure: Figure 3
  alt: >
    A line plot of the percentage of coral reefs surrounded by water above an
    aragonite saturation threshold, against atmospheric CO2 from 300 to 800 parts per
    million. Three curves correspond to thresholds of 3.5, 3.25, and 3. All start at
    100 per cent near 300 ppm and fall to near zero by 700 to 800 ppm, with the three
    curves widely separated in the middle of the range and converging at both ends.
  caption: >
    Which saturation threshold corals actually need matters enormously in the middle
    of the range and not at all at the top of it. By 700 to 800 ppm the three curves have
    converged on zero, so the biological uncertainty stops affecting the outcome.
